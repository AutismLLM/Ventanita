[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventanita"
version = "0.1.0"
description = "A while-loop that watches WhatsApp and takes orders. Not a platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mss",
    "pytesseract",
    "pyautogui",
    "pyyaml",
    "requests",
    "pynput",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ventanita = "ventanita.main:run"
ventanita-calibrate = "ventanita.calibrate:main"

[tool.setuptools.packages.find]
where = ["src"]
