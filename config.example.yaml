window:
  region: [0, 0, 800, 600]        # chat area rectangle, from calibrate.py
  badge_corner: [0, 0, 20, 20]    # tiny unread-badge crop (unused since 0.2.2; the row scan below is the trigger now)
  input_pos: [400, 590]           # click point for input field
  chat_list_row: [100, 100, 300, 60]  # fallback row if no badge detected
  unread_badge_x_range: [0, 40]      # x-band where the green unread dot appears, from calibrate.py
  list_scan_range: [0, 600]         # y-range to scan for it
timing:
  check_interval_sec: 5
  think_delay: [3, 15]            # random range before reply
  type_jitter: [0.03, 0.12]       # per-char delay
  post_send_pause: [10, 60]       # once per drain (after the whole batch), not per chat
  active_hours: [8, 22]           # sleep outside this
  session_gap_hours: 3            # customer quiet this long = new session: older turns fold into a short note instead of raw replay. Omit = 3.
  typing_wait_sec: 15             # max wait while a row shows "typing..." before answering anyway. Adds up per chat in a burst; keep short. Omit = 15.
llm:
  provider: openai                # or anthropic / local
  model: gpt-5.6-terra             # balanced tier: catches menu mismatches, doesn't guess.
                                    # gpt-5.6-luna = cheaper/faster if volume gets high; sol = overkill for taco orders.
  summary_model: gpt-5.6-luna      # cheap tier for folding an old session into the customer note. Omit = gpt-5.6-luna.
  api_key_env: OPENAI_API_KEY      # actual key lives in .env, never in this file or git
paths:
  db: ./ventanita.db
  menu: ./menu.txt
  log: ./ventanita.log
safety:
  max_reply_chars: 320
  confirm_above_mxn: 500           # human gate threshold
  killswitch_key: f9
  allowed_chats: []                 # e.g. ["Nico"] to restrict replies to matching chats during testing. Empty = reply to any unread chat.
  max_chats_per_drain: 4            # most chats opened in one pass before sleeping; a bigger burst waits for the next cycle. Omit = 4.
